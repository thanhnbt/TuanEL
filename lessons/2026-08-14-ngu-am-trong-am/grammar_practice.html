<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice — Ngữ Pháp 14/08 — English Daily</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .lesson-topbar{background:#fff;border-bottom:1px solid #e2e4e8;padding:0 1rem;position:sticky;top:0;z-index:99}
    .lesson-topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px}
    .lesson-topbar .back-link{color:#2563eb;text-decoration:none;font-size:13px;font-weight:600;padding:10px 0;margin-right:16px;white-space:nowrap}
    .lesson-topbar .back-link:hover{opacity:.7}
    .sub-nav{display:flex;gap:4px;overflow-x:auto}
    .sub-nav a{padding:10px 14px;font-size:13px;font-weight:500;color:#6b7280;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
    .sub-nav a:hover{color:#1a1a1a}
    .sub-nav a.active{color:#2563eb;border-bottom-color:#2563eb}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf7;color:#1a1a1a}
    .container{max-width:800px;margin:0 auto;padding:1.5rem 1rem 5rem}
    .test-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
    .test-tab{padding:8px 14px;border:2px solid #e2e4e8;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;background:#fff;color:#6b7280;transition:all .2s}
    .test-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
    .test-tab:hover:not(.active){border-color:#2563eb;color:#2563eb}
    .grammar-badge{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:.5rem .9rem;font-size:.82rem;color:#1e40af;margin-bottom:1rem;line-height:1.5}
    .controls{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
    .shuffle-btn{padding:6px 14px;border:2px solid #e2e4e8;border-radius:8px;font-size:.85rem;cursor:pointer;background:#fff;transition:all .2s}
    .shuffle-btn.on{background:#fef3c7;border-color:#f59e0b;color:#92400e}
    .passage-block{background:#f8fafc;border-left:4px solid #3b82f6;padding:.8rem 1rem;margin:1.2rem 0 .6rem;font-size:.9rem;line-height:1.7;border-radius:0 8px 8px 0;font-style:italic;color:#334155}
    .q-item{background:#fff;border:1px solid #e2e4e8;border-radius:12px;padding:1rem 1.2rem;margin-bottom:.8rem}
    .q-item .q-num{font-weight:700;color:#2563eb;margin-right:6px}
    .q-text{font-size:.95rem;line-height:1.6;margin-bottom:.7rem}
    .opts{display:flex;flex-direction:column;gap:6px}
    .opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid #e2e4e8;border-radius:8px;cursor:pointer;font-size:.9rem;transition:all .15s;line-height:1.4}
    .opt:hover{border-color:#93c5fd;background:#f0f7ff}
    .opt.selected{border-color:#2563eb;background:#eff6ff}
    .opt .letter{width:26px;height:26px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#64748b;flex-shrink:0}
    .opt.selected .letter{background:#2563eb;color:#fff}
    .hint-box{display:none;margin-top:.6rem;padding:.5rem .8rem;background:#fefce8;border:1px solid #fde047;border-radius:8px;font-size:.84rem;line-height:1.5;color:#854d0e}
    .hint-box.show{display:block}
    .submit-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e4e8;padding:.8rem 1rem;text-align:center;z-index:98;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
    .btn-submit{padding:12px 32px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;background:#2563eb;color:#fff;transition:opacity .2s}
    .btn-submit:hover{opacity:.85}
    .btn-submit.final{background:#10b981}
    .btn-reset{padding:12px 24px;border:2px solid #e2e4e8;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;background:#fff;color:#6b7280;transition:all .2s;margin-left:8px}
    .btn-reset:hover{border-color:#2563eb;color:#2563eb}
    .opt.correct{border-color:#10b981;background:#f0fdf4}
    .opt.correct .letter{background:#10b981;color:#fff}
    .opt.wrong{border-color:#ef4444;background:#fef2f2}
    .opt.wrong .letter{background:#ef4444;color:#fff}
    .score-screen{display:none;text-align:center;padding:2rem 1rem}
    .score-screen.show{display:block}
    .score-big{font-size:3.5rem;font-weight:800;color:#2563eb}
    .score-sub{font-size:1.1rem;color:#6b7280;margin:.5rem 0}
    .score-stars{font-size:2rem;margin:.5rem 0}
    .btn-again{padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;background:#2563eb;color:#fff;margin-top:1rem}
    @media(max-width:700px){.container{padding:1rem .7rem 5rem}.q-item{padding:.8rem}.opt{padding:6px 10px;font-size:.84rem}}
    @media print{.submit-bar,.controls,.score-screen{display:none!important}.q-item{border:1.5px solid #333;page-break-inside:avoid}}
    @media(monochrome){*{transition:none!important;box-shadow:none!important}body{background:#fff!important;color:#000!important}.test-tab{border:2px solid #000;background:#fff!important;color:#000!important}.test-tab.active{background:#000!important;color:#fff!important}.opt{border:2px solid #000}.opt.selected{background:#ddd!important}}
    body.eink,body.eink *{transition:none!important;box-shadow:none!important}body.eink{background:#fff!important;color:#000!important}body.eink .test-tab{border:2px solid #000;background:#fff!important;color:#000!important}body.eink .test-tab.active{background:#000!important;color:#fff!important}body.eink .opt{border:2px solid #000}body.eink .opt.selected{background:#ddd!important}
</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --blue: #2563eb;
    --green: #059669;
    --orange: #d97706;
    --red: #dc2626;
    --purple: #7c3aed;
    --teal: #0d9488;
    --border: #e2e4e8;
    --ipa-color: #6d28d9;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 2px 8px rgba(0,0,0,.08);
  }

  body {
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    text-align: center;
    padding: 1.75rem 1rem 1.25rem;
    margin-bottom: 1.25rem;
    background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 50%, #7c3aed 100%);
    border-radius: 14px;
    color: #fff;
  }
  header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  header p { font-size: .8rem; opacity: .8; margin-top: .25rem; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .card-title {
    font-size: .9rem;
    font-weight: 700;
    margin-bottom: .75rem;
    display: flex;
    align-items: center;
    gap: .4rem;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .card-title .num {
    width: 24px; height: 24px;
    background: var(--blue);
    color: #fff;
    border-radius: 6px;
    font-size: .7rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .sub-title {
    font-size: .8rem;
    font-weight: 700;
    margin: .75rem 0 .4rem;
    color: var(--text);
    border-bottom: 2px solid var(--border);
    padding-bottom: .2rem;
  }

  /* Word chip */
  .w {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px 4px;
    margin: 3px;
    cursor: pointer;
    transition: all .15s;
    min-width: 72px;
    position: relative;
  }
  .w:hover { background: #eef2ff; border-color: var(--blue); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .w:active { transform: translateY(0); }
  .w.playing { background: #dbeafe; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .w.error { border-color: var(--orange); }

  .w .eng {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .w .eng .sp { font-size: .6rem; opacity: .4; }
  .w .phon {
    font-family: 'JetBrains Mono', monospace;
    font-size: .68rem;
    font-weight: 500;
    color: var(--ipa-color);
    margin-top: 1px;
    white-space: nowrap;
  }
  .w .stress-mark { color: var(--red); font-weight: 800; }

  /* IPA big */
  .ipa { font-family: 'JetBrains Mono', monospace; color: var(--ipa-color); font-weight: 600; }
  .ipa-lg { font-size: 1.3rem; }
  .ipa-sm { font-size: .78rem; }

  /* Rule boxes */
  .rule {
    border-radius: 10px;
    padding: .6rem .75rem;
    margin: .4rem 0;
    border-left: 4px solid;
  }
  .rule.s-voiceless { background: #fffbeb; border-color: var(--orange); }
  .rule.s-sibilant  { background: #fdf2f8; border-color: var(--red); }
  .rule.s-voiced    { background: #ecfdf5; border-color: var(--green); }
  .rule.ed-id       { background: #f5f3ff; border-color: var(--purple); }
  .rule.ed-t        { background: #fffbeb; border-color: var(--orange); }
  .rule.ed-d        { background: #ecfdf5; border-color: var(--green); }

  .rule h4 { font-size: .78rem; font-weight: 700; margin-bottom: .15rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .rule .desc { font-size: .72rem; color: var(--muted); margin-bottom: .3rem; }
  .rule .words { display: flex; flex-wrap: wrap; gap: 2px; }

  /* Stress items */
  .si {
    display: flex;
    align-items: flex-start;
    gap: .6rem;
    padding: .5rem .6rem;
    border-radius: 8px;
    background: #f8fafc;
    border: 1px solid var(--border);
    margin-bottom: .4rem;
  }
  .si .tag {
    flex-shrink: 0;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .si .tag.na { background: #dbeafe; color: #1d4ed8; }
  .si .tag.vb { background: #dcfce7; color: #15803d; }
  .si .note { font-size: .72rem; color: var(--muted); margin-bottom: .2rem; }

  /* Suffix table */
  .stbl { width: 100%; border-collapse: collapse; font-size: .75rem; margin-top: .4rem; }
  .stbl th {
    background: #f1f5f9; padding: .4rem; text-align: left;
    font-weight: 600; border-bottom: 2px solid var(--border);
    font-size: .68rem; text-transform: uppercase; color: var(--muted); letter-spacing: .03em;
  }
  .stbl td { padding: .4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .stbl tr:last-child td { border-bottom: none; }
  .sfx { font-family: 'JetBrains Mono', monospace; color: var(--red); font-weight: 600; font-size: .75rem; }

  /* Schwa */
  .schwa {
    background: #fefce8; border: 1px dashed #ca8a04;
    border-radius: 8px; padding: .6rem .75rem; margin-top: .6rem; font-size: .75rem;
  }
  .schwa h4 { color: #854d0e; font-size: .78rem; margin-bottom: .2rem; }

  /* Vowel grid */
  .vg {
    display: grid;
    grid-template-columns: 36px auto 1fr;
    gap: .2rem .6rem;
    font-size: .78rem;
    align-items: center;
  }
  .vl {
    font-weight: 800; font-size: 1rem;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px;
  }
  .vl.a  { background: #fee2e2; color: #dc2626; }
  .vl.e  { background: #dbeafe; color: #2563eb; }
  .vl.o  { background: #dcfce7; color: #15803d; }
  .vl.ou { background: #fef3c7; color: #92400e; font-size: .8rem; }
  .vl.u  { background: #ede9fe; color: #7c3aed; }
  .vl.iy { background: #fce7f3; color: #be185d; font-size: .75rem; }

  .full { grid-column: 1 / -1; }

  footer {
    text-align: center; padding: 1.25rem;
    color: var(--muted); font-size: .7rem; margin-top: 1rem;
  }

  /* Loading indicator */
  .w .loader {
    position: absolute; inset: 0;
    background: rgba(255,255,255,.7);
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: .6rem;
    color: var(--blue);
  }
  .w.loading .loader { display: flex; }

  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .w.loading .loader::after { content: '⏳'; animation: pulse .8s infinite; font-size: .9rem; }
</style>
</head>
<body>
<div class="lesson-topbar">
  <div class="lesson-topbar-inner">
    <a href="../../index.html" class="back-link">📘 ← Trang chủ</a>
    <nav class="sub-nav">
      <a href="index.html">📗 Lý thuyết</a>

      <a href="grammar_practice.html" class="active">🧩 Luyện Ngữ Pháp</a>
    </nav>
  </div>
</div>
<div class="container">
<br>
  <div class="test-tabs" id="testTabs"></div>
  <div class="grammar-badge" id="grammarBadge"></div>
  <div class="controls">
    <button class="shuffle-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 Trộn câu</button>
  </div>
  <div id="questionList"></div>
  <div class="score-screen" id="scoreScreen"></div>
</div>
<div class="submit-bar" id="submitBar">
  <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">📝 Kiểm tra</button>
  <button class="btn-reset" id="resetBtn" onclick="resetTest()">🔄 Làm lại</button>
</div>

<script src="data/g2.js"></script>

<script>
(function(){
  if(localStorage.getItem('eink')==='true')document.body.classList.add('eink');
  window.GRAMMAR_TESTS=window.GRAMMAR_TESTS||[];
  window.currentTest=0;
  var order=[],selections=[],phase='answer',shuffleOn=false;

  function buildTabs(){
    var h='';
    for(var i=0;i<GRAMMAR_TESTS.length;i++)h+='<div class="test-tab'+(i===currentTest?' active':'')+'" onclick="selectTest('+i+')">Test '+(i+1)+'</div>';
    document.getElementById('testTabs').innerHTML=h;
    document.getElementById('grammarBadge').innerHTML=GRAMMAR_TESTS[currentTest].badge;
  }

  function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function renderAll(){
    var qs=GRAMMAR_TESTS[currentTest].questions;
    document.getElementById('submitBtn').textContent='📝 Kiểm tra';
    document.getElementById('submitBtn').className='btn-submit';
    document.getElementById('scoreScreen').className='score-screen';
    document.getElementById('submitBar').style.display='';
    var html='';var letters=['A','B','C','D'];
    for(var i=0;i<order.length;i++){
      var q=qs[order[i]];
      if(q.passage)html+='<div class="passage-block">'+q.passage+'</div>';
      html+='<div class="q-item" id="qi'+i+'">';
      html+='<div class="q-text"><span class="q-num">'+(i+1)+'.</span> '+q.q+'</div>';
      html+='<div class="opts">';
      for(var j=0;j<q.opts.length;j++){
        var cls = '';
        if (selections[i] === j) cls += ' selected';
        if (phase === 'done' && selections[i] !== -1) {
          if (j === q.ans) cls += ' correct';
          else if (j === selections[i]) cls += ' wrong';
        }
        html+='<div class="opt'+cls+'" data-q="'+i+'" data-o="'+j+'" onclick="pickOpt('+i+','+j+',this)">';
        html+='<span class="letter">'+letters[j]+'</span><span>'+q.opts[j]+'</span></div>';
      }
      html+='</div>';
      html+='<div class="hint-box'+(phase==='done'?' show':'')+'" id="hint'+i+'">💡 '+q.exp+'</div>';
      html+='</div>';
    }
    document.getElementById('questionList').innerHTML=html;
    if(phase==='done') {
      var opts=document.querySelectorAll('.opt');
      for(var k=0;k<opts.length;k++)opts[k].style.pointerEvents='none';
      var score=0;
      for(var i=0;i<order.length;i++) if(selections[i]===qs[order[i]].ans) score++;
      var answered=selections.filter(function(s){return s!==-1;}).length;
      var pct=Math.round(score/order.length*100);
      var stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';
      document.getElementById('submitBtn').textContent=stars+' '+score+'/'+answered+' (đã làm '+answered+'/'+order.length+')';
    }
  }

  window.selectTest=function(t){
    window.currentTest=t;
    var states = JSON.parse(localStorage.getItem('grammar_testStates') || '{}');
    if (states[t]) {
      var s = states[t];
      order = s.order;
      selections = s.selections;
      phase = s.phase;
      buildTabs();
      renderAll();
      saveState();
    } else {
      startTest();
    }
  };

  window.resetTest=function(){
    startTest();
  };

  window.toggleShuffle=function(){
    shuffleOn=!shuffleOn;
    document.getElementById('shuffleBtn').className='shuffle-btn'+(shuffleOn?' on':'');
    startTest();
  };

  function startTest(){
    var qs=GRAMMAR_TESTS[currentTest].questions;
    order=shuffleOn?shuffle([...Array(qs.length).keys()]):[...Array(qs.length).keys()];
    selections=new Array(order.length).fill(-1);
    phase='answer';
    buildTabs();
    renderAll();
    saveState();
  }

  function saveState(){
    var states = JSON.parse(localStorage.getItem('grammar_testStates') || '{}');
    states[window.currentTest] = {
      order: order,
      selections: selections,
      phase: phase
    };
    localStorage.setItem('grammar_testStates', JSON.stringify(states));
    localStorage.setItem('grammar_currentTest', window.currentTest);
    localStorage.setItem('grammar_shuffleOn', shuffleOn);
  }

  window.pickOpt=function(qi,oi,el){
    if(phase==='done')return;
    selections[qi]=oi;
    var opts=document.querySelectorAll('#qi'+qi+' .opt');
    for(var k=0;k<opts.length;k++)opts[k].classList.remove('selected');
    el.classList.add('selected');
    saveState();
  };

  window.handleSubmit=function(){
    if(phase!=='answer')return;
    var answeredCount=selections.filter(function(s){return s!==-1;}).length;
    var minReq=Math.ceil(order.length * 2 / 3);
    if(answeredCount<minReq){
      alert('Vui lòng làm ít nhất '+minReq+' câu trước khi nộp bài để xem đáp án nhé!');
      return;
    }
    phase='done';
    var qs=GRAMMAR_TESTS[currentTest].questions;
    var score=0;
    for(var i=0;i<order.length;i++){
      if(selections[i]===-1)continue;
      var correct=qs[order[i]].ans;
      if(selections[i]===correct){
        score++;
        document.querySelector('#qi'+i+' .opt[data-o="'+selections[i]+'"]').classList.add('correct');
      }else{
        document.querySelector('#qi'+i+' .opt[data-o="'+selections[i]+'"]').classList.add('wrong');
        document.querySelector('#qi'+i+' .opt[data-o="'+correct+'"]').classList.add('correct');
      }
      document.getElementById('hint'+i).classList.add('show');
    }
    var answered=selections.filter(function(s){return s!==-1;}).length;
    var total=order.length;
    var pct=Math.round(score/total*100);
    var stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';
    var opts=document.querySelectorAll('.opt');
    for(var k=0;k<opts.length;k++)opts[k].style.pointerEvents='none';
    document.getElementById('submitBtn').textContent=stars+' '+score+'/'+answered+' (đã làm '+answered+'/'+total+')';
    document.getElementById('submitBtn').className='btn-submit final';
    saveState();
  };

  function restoreDoneState(){
    var qs=GRAMMAR_TESTS[currentTest].questions;
    var score=0;
    for(var i=0;i<order.length;i++){
      if(selections[i]===-1)continue;
      var correct=qs[order[i]].ans;
      if(selections[i]===correct){
        score++;
        document.querySelector('#qi'+i+' .opt[data-o="'+selections[i]+'"]').classList.add('correct');
      }else{
        document.querySelector('#qi'+i+' .opt[data-o="'+selections[i]+'"]').classList.add('wrong');
        document.querySelector('#qi'+i+' .opt[data-o="'+correct+'"]').classList.add('correct');
      }
      document.getElementById('hint'+i).classList.add('show');
    }
    var answered=selections.filter(function(s){return s!==-1;}).length;
    var total=order.length;
    var pct=Math.round(score/total*100);
    var stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';
    var opts=document.querySelectorAll('.opt');
    for(var k=0;k<opts.length;k++)opts[k].style.pointerEvents='none';
    document.getElementById('submitBtn').textContent=stars+' '+score+'/'+answered+' (đã làm '+answered+'/'+total+')';
    document.getElementById('submitBtn').className='btn-submit final';
  }

  function initApp(){
    if(GRAMMAR_TESTS.length===0) return;
    
    var savedTest = localStorage.getItem('grammar_currentTest');
    var savedShuffle = localStorage.getItem('grammar_shuffleOn');
    if(savedShuffle !== null) {
      shuffleOn = savedShuffle === 'true';
    }
    if(document.getElementById('shuffleBtn')) {
       document.getElementById('shuffleBtn').className='shuffle-btn'+(shuffleOn?' on':'');
    }

    if(savedTest !== null){
      try {
        window.currentTest = parseInt(savedTest, 10);
        var states = JSON.parse(localStorage.getItem('grammar_testStates') || '{}');
        if (states[window.currentTest]) {
          var state = states[window.currentTest];
          order = state.order || [];
          selections = state.selections || [];
          phase = state.phase || 'answer';
          buildTabs();
          renderAll();
          return;
        }
      } catch(e) {}
    }
    
    window.currentTest = 0;
    startTest();
  }

  initApp();
})();
</script>
<script src="../../js/config.js"></script>
<script>
  function speak(word) {
    if (!window.MW_API_KEY) { _tts(word); return; }
    var w = word.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z\-]/g, '');
    if (!w) return;
    fetch('https://www.dictionaryapi.com/api/v3/references/sd3/json/' + encodeURIComponent(w) + '?key=' + window.MW_API_KEY)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!Array.isArray(data) || !data.length || typeof data[0] === 'string') throw 'x';
        var af = _findAudio(data, w);
        if (!af) throw 'no audio';
        var sub = af.substr(0,3)==='bix'?'bix':af.substr(0,2)==='gg'?'gg':/^\d/.test(af)?'number':af[0];
        new Audio('https://media.merriam-webster.com/audio/prons/en/us/mp3/'+sub+'/'+af+'.mp3').play();
      })
      .catch(function() { _tts(word); });
  }
  function _findAudio(data, w) {
    for (var i = 0; i < data.length; i++) {
      var e = data[i];
      var hw = (e.hwi && e.hwi.hw) ? e.hwi.hw.replace(/\*/g,'') : '';
      if (hw === w && e.hwi.prs) {
        for (var j = 0; j < e.hwi.prs.length; j++) {
          if (e.hwi.prs[j].sound && e.hwi.prs[j].sound.audio) return e.hwi.prs[j].sound.audio;
        }
      }
    }
    for (var i = 0; i < data.length; i++) {
      var uros = data[i].uros;
      if (!uros) continue;
      for (var k = 0; k < uros.length; k++) {
        var ure = (uros[k].ure || '').replace(/\*/g,'');
        if (ure === w && uros[k].prs) {
          for (var j = 0; j < uros[k].prs.length; j++) {
            if (uros[k].prs[j].sound && uros[k].prs[j].sound.audio) return uros[k].prs[j].sound.audio;
          }
        }
      }
    }
    for (var i = 0; i < data.length; i++) {
      var e = data[i];
      if (e.hwi && e.hwi.prs) {
        for (var j = 0; j < e.hwi.prs.length; j++) {
          if (e.hwi.prs[j].sound && e.hwi.prs[j].sound.audio) return e.hwi.prs[j].sound.audio;
        }
      }
    }
    return null;
  }
  function _tts(word) {
    if (window.speechSynthesis) { var m = new SpeechSynthesisUtterance(word); m.lang='en-US'; m.rate=0.85; speechSynthesis.speak(m); }
  }
</script>
